<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Music</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
</head>
<body>
    <main class="container">
        <header class="hero-text">
            <h1 class="main-title">
                <span class="pink-glow">Creating music</span> <span class="cyan-glow">is my hobby.</span>
            </h1>

            <p class="large-text">
                I spend my free time <span class="pink-glow">composing</span><br>
                and <span class="pink-glow">producing</span> tracks that reflect my<br>
                emotions and <span class="pink-glow">experiences</span>.
            </p>

            <p class="medium-text">
                <span class="cyan-glow">Here you can listen to some of my</span> <span class="pink-muted">creations.</span>
            </p>
        </header>

        <section class="music-library">
            <!-- Music library will be populated by JavaScript -->
        </section>
    </main>
    <script src="script.js"></script>
</body>
</html>
